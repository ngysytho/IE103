spring.config.import=optional:file:.env[.properties],optional:file:Backend/.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_DB:ie103}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:your_password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_DB:ie103}
spring.flyway.user=${DATABASE_USER:postgres}
spring.flyway.password=${DATABASE_PASSWORD:your_password}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DATABASE_SCHEMA:public}
spring.flyway.schemas=${DATABASE_SCHEMA:public}
spring.flyway.baseline-on-migrate=false
